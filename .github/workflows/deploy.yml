name: Deploy to GitHub Pages #deployment

on:
  push:
    branches: [main]        #sub branches
  workflow_dispatch:

permissions:                  #tokens
  contents: read
  pages: write
  id-token: write

concurrency:                          
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci                                                       
      - run: npm run build
      - name: SPA fallback for client-side routes    #commandline commands 
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest                     
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}            # deploy url
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4                  #gitpages deplayment
